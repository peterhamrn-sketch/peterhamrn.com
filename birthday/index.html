<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120d22"><meta name="robots" content="noindex,nofollow,noarchive"><title>For the Birthday Girl</title><meta name="description" content="A very important birthday delivery for the Birthday Girl."><link rel="icon" type="image/svg+xml" href="/peterhamrn-logo.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta property="og:type" content="website"><meta property="og:site_name" content="PeterHamRN.com"><meta property="og:url" content="https://peterhamrn.com/birthday/"><meta property="og:title" content="For the Birthday Girl"><meta property="og:description" content="A very important birthday delivery..."><meta property="og:image" content="https://peterhamrn.com/apple-touch-icon.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="180"><meta property="og:image:height" content="180"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="For the Birthday Girl"><meta name="twitter:description" content="A very important birthday delivery..."><meta name="twitter:image" content="https://peterhamrn.com/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--gold:#dfbd78;--paper:#e8c98c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 35%,#3a213e 0,#1b1128 42%,#090711 100%);color:#fff}.page{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;padding:max(16px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));gap:10px}.headline{z-index:20;margin:0;text-align:center;color:#eadbbd;font:600 clamp(14px,2.5vw,24px)/1.25 Georgia,serif;letter-spacing:clamp(2px,.5vw,6px);text-shadow:0 3px 18px #000}.scene{position:relative;width:min(760px,94vw);height:100%;min-height:260px;display:grid;place-items:center;perspective:1200px}.envelope-button{appearance:none;border:0;background:none;color:inherit;padding:0;width:min(680px,90vw);aspect-ratio:1.62;position:absolute;cursor:pointer;filter:drop-shadow(0 22px 25px #0009);transition:opacity .9s ease,transform .9s ease;z-index:5}.envelope-back,.envelope-front,.flap{position:absolute;inset:0;border-radius:14px}.envelope-back{background:linear-gradient(145deg,#f4daa2,#c69955);border:2px solid #a87b3e}.flap{background:linear-gradient(155deg,#f6e3b9,#cda461);clip-path:polygon(0 0,100% 0,50% 61%);transform-origin:50% 0;z-index:3;backface-visibility:hidden;transition:transform 1.8s cubic-bezier(.22,.7,.2,1)}.envelope-front{z-index:4;background:linear-gradient(150deg,transparent 49.7%,#d2aa68 50%) left/50.2% 100% no-repeat,linear-gradient(210deg,transparent 49.7%,#c79a55 50%) right/50.2% 100% no-repeat,linear-gradient(to top,#d0a661 0 46%,transparent 46%);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}.label{position:absolute;z-index:6;left:50%;top:68%;transform:translate(-50%,-50%);white-space:nowrap;color:#553a1c;font:italic 600 clamp(20px,4vw,38px)/1.1 Georgia,serif;text-shadow:0 1px #fff8}.hint{position:absolute;z-index:7;left:50%;bottom:7%;transform:translateX(-50%);font-size:clamp(12px,2vw,16px);color:#583b1d;opacity:.82}.card-wrap{position:absolute;z-index:2;display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(30%);will-change:transform,opacity}.card{display:block;width:auto;height:auto;max-width:calc(100vw - 24px);max-height:calc(100dvh - 120px);object-fit:contain;border-radius:8px;box-shadow:0 22px 60px #000b}.opening .flap{transform:rotateX(180deg)}.opening .envelope-button{cursor:default}.rising .card-wrap{visibility:visible;animation:rise 2.8s cubic-bezier(.18,.72,.16,1) forwards;z-index:3}.revealed .card-wrap{visibility:visible;opacity:1;transform:none;z-index:10}.revealed .envelope-button{opacity:0;transform:translateY(28%) scale(.9);pointer-events:none}.revealed .headline{opacity:.35;transition:opacity .7s}.controls{z-index:30;min-height:38px;display:flex;gap:10px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}.revealed .controls{opacity:1;pointer-events:auto}.controls button{border:1px solid #d8bd8370;border-radius:999px;background:#160f22cc;color:#e9d9b8;padding:8px 15px;font:600 14px/1 -apple-system,sans-serif}.fallback{display:none}.fallback.show{display:inline-flex}@keyframes rise{0%{opacity:0;transform:translateY(28%) scale(.58)}18%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1)}}.confetti{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-8vh;width:9px;height:18px;background:var(--c);animation:fall var(--d) linear var(--delay) forwards;transform:rotate(var(--r))}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(900deg)}}@media (orientation:landscape) and (max-height:600px){.page{grid-template-rows:auto 1fr auto;padding-top:8px;padding-bottom:8px;gap:5px}.headline{font-size:12px}.card{max-height:calc(100dvh - 76px)}.controls button{padding:6px 13px}.envelope-button{width:min(510px,70vw)}}@media(prefers-reduced-motion:reduce){.flap,.envelope-button{transition-duration:.35s}.rising .card-wrap{animation-duration:.7s}}
</style></head><body><main class="page" id="page"><h1 class="headline">A VERY IMPORTANT BIRTHDAY DELIVERY...</h1><section class="scene" aria-live="polite"><button class="envelope-button" id="envelope" aria-label="Open birthday delivery"><span class="envelope-back"></span><span class="flap"></span><span class="envelope-front"></span><span class="label">For the Birthday Girl</span><span class="hint">Tap to open ♥</span></button><div class="card-wrap"><img class="card" id="card" alt="Dachshund birthday card"></div></section><div class="controls"><button id="replay" type="button">Replay</button><button id="music" type="button">Music Off</button><button class="fallback" id="fallback" type="button">Play Music</button></div></main><audio id="song" preload="auto" playsinline></audio><div class="confetti" id="confetti"></div><script src="img-start.js"></script><script src="img-0.js"></script><script src="img-1.js"></script><script src="img-2.js"></script><script src="img-3.js"></script><script src="img-4.js"></script><script src="aud-start.js"></script><script src="aud-0.js"></script><script src="aud-1.js"></script><script src="assets-init.js"></script><script>
const page=document.getElementById('page'),env=document.getElementById('envelope'),song=document.getElementById('song'),music=document.getElementById('music'),fallback=document.getElementById('fallback'),confetti=document.getElementById('confetti');let timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}function play(){song.currentTime=0;const p=song.play();music.textContent='Music Off';if(p)p.catch(()=>fallback.classList.add('show'))}function celebrate(){confetti.textContent='';const colors=['#f6c44e','#ef5577','#67d5df','#9a72e8','#fff'];for(let i=0;i<90;i++){const n=document.createElement('i');n.className='piece';n.style.left=Math.random()*100+'vw';n.style.setProperty('--c',colors[i%colors.length]);n.style.setProperty('--d',3+Math.random()*3+'s');n.style.setProperty('--delay',Math.random()*1.4+'s');n.style.setProperty('--x',(Math.random()*30-15)+'vw');n.style.setProperty('--r',Math.random()*360+'deg');confetti.appendChild(n)}later(()=>confetti.textContent='',7000)}
function openCard(){if(page.classList.contains('opening'))return;play();page.classList.add('opening');later(()=>page.classList.add('rising'),2200);later(()=>{page.classList.add('revealed');celebrate()},5000)}env.addEventListener('click',openCard);document.getElementById('replay').addEventListener('click',()=>{timers.forEach(clearTimeout);timers=[];song.pause();confetti.textContent='';page.className='page';void page.offsetWidth;later(openCard,300)});music.addEventListener('click',()=>{if(song.paused)play();else{song.pause();music.textContent='Music On'}});fallback.addEventListener('click',()=>{play();fallback.classList.remove('show')});
</script></body></html>
