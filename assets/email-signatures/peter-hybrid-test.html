<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Peter Ham RN Support Email Signature</title>
<style>
body{margin:0;color:#10275a;background:#f3f6fb;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
main{max-width:580px;margin:0 auto;padding:28px 18px}
.copy-panel{padding:18px;border:1px solid #c9d3e6;border-radius:12px;background:#fff;overflow:hidden}
button{display:block;margin:0 0 18px;padding:14px 22px;border:0;border-radius:10px;background:#10275a;color:#fff;font-size:18px;font-weight:700}
#status{margin:0 0 14px;font-size:14px;min-height:18px}
#signature{width:416px;height:208px;transform-origin:top left}

  main{padding:18px 10px}
  .copy-panel{padding:12px}

  #signature{transform:scale(.80);margin-bottom:-42px}

</style>
</head><body><main><section class="copy-panel"><button id="copyButton" type="button">Copy signature</button><div id="status" aria-live="polite"></div><div id="signature"><table role="presentation" width="416" cellspacing="0" cellpadding="0" border="0" style="width:416px;height:208px;margin:0;border:0;border-collapse:collapse;table-layout:fixed;mso-table-lspace:0;mso-table-rspace:0;"><tr><td width="194" valign="top" style="width:193.6px;height:208px;margin:0;padding:0;vertical-align:top;"><img src="https://peterhamrn.com/assets/email-signatures/peter-brand.png" width="194" height="208" alt="Peter Ham RN — Practical Experience. Practical Solutions." style="display:block;width:193.6px;height:208px;margin:0;padding:0;border:0;"></td><td width="222" valign="top" style="box-sizing:border-box;width:222.4px;height:208px;margin:0;padding:52px 6.4px 0 16px;color:#08265e;font-family:Arial,Helvetica,sans-serif;vertical-align:top;"><div style="margin:0;padding:0;white-space:nowrap;line-height:17.6px;"><span style="color:#08265e;font-size:16px;font-weight:700;">Peter Ham RN Support</span></div><div style="margin:1.6px 0 0;padding:0;color:#08265e;font-size:10.4px;font-style:italic;line-height:15.2px;white-space:nowrap;">Technical &amp; Customer Support</div><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;margin:17.6px 0 0;border:0;border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;"><tr><td style="margin:0;padding:0 0 6.4px;color:#08265e;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;"><a href="https://peterhamrn.com" style="color:#08265e;text-decoration:none;">PeterHamRN.com</a></td></tr><tr><td style="margin:0;padding:0;color:#08265e;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;"><a href="mailto:support@peterhamrn.com" style="color:#08265e;text-decoration:none;">support@peterhamrn.com</a></td></tr></table></td></tr></table></div></section></main>
<script>
const button=document.getElementById('copyButton'),status=document.getElementById('status'),signature=document.getElementById('signature');
button.addEventListener('click',async()=>{try{const html=signature.innerHTML;const text=signature.innerText;if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);}else{const range=document.createRange();range.selectNodeContents(signature);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);document.execCommand('copy');selection.removeAllRanges();}status.textContent='Copied. Paste it into Proton.';button.textContent='Copied ✓';}catch(e){status.textContent='Copy was blocked by the browser. Try again in Safari.';}});
</script></body></html>
