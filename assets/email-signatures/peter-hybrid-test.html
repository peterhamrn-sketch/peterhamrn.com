<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Peter Ham Hybrid Email Signature Test</title>
  <style>
    body {
      margin: 0;
      min-width: 580px;
      color: #10275a;
      background: #f3f6fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 580px;
      margin: 0 auto;
      padding: 48px 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.2;
    }

    .instructions {
      margin: 0 0 24px;
      color: #3f4c66;
      font-size: 16px;
      line-height: 1.5;
    }

    .copy-panel {
      width: 560px;
      margin-left: -20px;
      padding: 19px;
      border: 1px solid #c9d3e6;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(16, 39, 90, 0.08);
    }

    .copy-label {
      margin: 0 0 12px;
      color: #3f4c66;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Peter Ham hybrid signature test</h1>
    <p class="instructions">
      In Safari, select only the signature inside the outlined box, copy it,
      then paste it into Proton Mail&rsquo;s rich-text Signature field.
    </p>

    <section class="copy-panel" aria-labelledby="copy-label">
      <p class="copy-label" id="copy-label">Copy only this signature</p>

      <!-- Copyable hybrid signature begins here. -->
      <table
        role="presentation"
        width="520"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="width:520px;height:260px;margin:0;border:0;border-collapse:collapse;table-layout:fixed;mso-table-lspace:0;mso-table-rspace:0;"
      >
        <tr>
          <td width="242" valign="top" style="width:242px;height:260px;margin:0;padding:0;vertical-align:top;">
            <img
              src="https://peterhamrn.com/assets/email-signatures/peter-brand.png"
              width="242"
              height="260"
              alt="Peter Ham RN — Practical Experience. Practical Solutions."
              style="display:block;width:242px;height:260px;margin:0;padding:0;border:0;"
            >
          </td>
          <td
            width="278"
            valign="top"
            style="box-sizing:border-box;width:278px;height:260px;margin:0;padding:54px 8px 0 20px;color:#08265e;font-family:Arial,Helvetica,sans-serif;vertical-align:top;"
          >
            <div style="margin:0;padding:0;white-space:nowrap;line-height:22px;">
              <span style="color:#08265e;font-size:20px;font-weight:700;">Peter Ham,</span>
              <span style="color:#666a73;font-size:16px;font-weight:400;"> BSN, RN</span>
            </div>
            <div style="margin:2px 0 0;padding:0;color:#08265e;font-size:13px;font-style:italic;line-height:19px;white-space:nowrap;">
              Nurse Consultant | Educator | Developer
            </div>

            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;margin:22px 0 0;border:0;border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;">
              <tr>
                <td style="margin:0;padding:0 0 8px;color:#08265e;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;">
                  <a href="https://peterhamrn.com" style="color:#08265e;text-decoration:none;">PeterHamRN.com</a>
                </td>
              </tr>
              <tr>
                <td style="margin:0;padding:0 0 8px;color:#08265e;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;">
                  <a href="tel:+18439575825" style="color:#08265e;text-decoration:none;">843-957-5825</a>
                </td>
              </tr>
              <tr>
                <td style="margin:0;padding:0;color:#08265e;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;">
                  <a href="mailto:peter@peterhamrn.com" style="color:#08265e;text-decoration:none;">peter@peterhamrn.com</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      <!-- Copyable hybrid signature ends here. -->
    </section>
  </main>
</body>
</html>
