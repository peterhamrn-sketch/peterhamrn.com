name: Add webmaster footer link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-webmaster-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add webmaster link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '<div class="copyright">© 2026 Peter Ham, BSN, RN. All rights reserved.</div>'
          new = '<div class="copyright">© 2026 Peter Ham, BSN, RN. All rights reserved. · <a href="mailto:webmaster@peterhamrn.com">Webmaster</a></div>'

          if old not in text:
              raise SystemExit('Expected footer line was not found.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add webmaster email link to footer"
          git push
